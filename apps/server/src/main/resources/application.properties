spring.application.name=Test365Alm
server.address=${TEST365ALM_SERVER_ADDRESS:127.0.0.1}
server.port=${TEST365ALM_SERVER_PORT:8080}
app.version=${APP_VERSION:unknown}
app.commit=${APP_COMMIT:unknown}

spring.datasource.url=${TEST365ALM_DATASOURCE_URL}
spring.datasource.username=${TEST365ALM_DATASOURCE_USERNAME}
spring.datasource.password=${TEST365ALM_DATASOURCE_PASSWORD}
spring.datasource.hikari.connection-timeout=${TEST365ALM_DB_CONNECTION_TIMEOUT_MS:2000}
spring.datasource.hikari.validation-timeout=${TEST365ALM_DB_CONNECTION_TIMEOUT_MS:2000}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.fail-on-missing-locations=true

test365alm.readiness.timeout-ms=${TEST365ALM_READINESS_TIMEOUT_MS:2000}

management.endpoints.web.exposure.include=health
