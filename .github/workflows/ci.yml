name: Test365Alm CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  planning-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record planning runtime
        run: |
          set -o pipefail
          python --version | tee planning-python-version.txt
      - name: Run planning tool tests
        run: |
          set -o pipefail
          python -m unittest discover -s tools/tests -v | tee planning-tests.txt
      - name: Validate planning package
        run: |
          set -o pipefail
          python tools/validate_package.py | tee planning-validation.txt
      - name: Run P0 health check
        run: |
          set -o pipefail
          python tools/p0_health_check.py | tee planning-p0-health.txt
      - name: Upload planning evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: planning-evidence
          path: |
            planning-python-version.txt
            planning-tests.txt
            planning-validation.txt
            planning-p0-health.txt
          if-no-files-found: ignore

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Record frontend runtime
        run: |
          set -o pipefail
          node --version | tee runtime-node.txt
          npm --version | tee runtime-npm.txt
      - run: |
          set -o pipefail
          npm ci 2>&1 | tee npm-ci.txt
      - run: |
          set -o pipefail
          npm run lint 2>&1 | tee lint.txt
      - run: |
          set -o pipefail
          npm run test:run -- --reporter=verbose 2>&1 | tee test-results.txt
      - run: |
          set -o pipefail
          npm run build 2>&1 | tee build.txt
      - name: Upload frontend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-evidence
          path: |
            apps/web/runtime-node.txt
            apps/web/runtime-npm.txt
            apps/web/npm-ci.txt
            apps/web/lint.txt
            apps/web/test-results.txt
            apps/web/build.txt
          if-no-files-found: ignore

  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11@sha256:f4c66b820c6f974249089d3d16d86a3698eae11e8746eb6644b2271031e91232
        env:
          POSTGRES_DB: test365alm
          POSTGRES_USER: test365alm
          POSTGRES_PASSWORD: test365alm_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test365alm -d test365alm"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Ensure Maven Wrapper is executable
        run: chmod +x mvnw
      - name: Record backend runtime
        run: |
          set -o pipefail
          java -version 2>&1 | tee runtime-java.txt
          ./mvnw -version | tee runtime-maven.txt
      - name: Run server unit tests
        run: |
          set -o pipefail
          ./mvnw -B -ntp test 2>&1 | tee unit-tests.txt
      - name: Run PostgreSQL integration tests and build
        env:
          TEST365ALM_IT_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/test365alm
          TEST365ALM_IT_DATASOURCE_USERNAME: test365alm
          TEST365ALM_IT_DATASOURCE_PASSWORD: test365alm_dev_password
        run: |
          set -o pipefail
          ./mvnw -B -ntp -Pintegration verify "-Dbuild.commit=${GITHUB_SHA}" 2>&1 | tee integration-build.txt
      - name: Upload backend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-evidence
          path: |
            apps/server/runtime-java.txt
            apps/server/runtime-maven.txt
            apps/server/unit-tests.txt
            apps/server/integration-build.txt
            apps/server/target/surefire-reports/**
            apps/server/target/failsafe-reports/**
          if-no-files-found: ignore

  readiness-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ensure Maven Wrapper is executable
        run: chmod +x apps/server/mvnw
      - name: Start isolated PostgreSQL
        run: |
          cp .env.example .env
          docker compose --env-file .env -p test365alm-r02 up -d --wait postgres
      - name: Build server jar for outage check
        working-directory: apps/server
        run: |
          set -o pipefail
          ./mvnw -B -ntp package -DskipTests "-Dbuild.commit=${GITHUB_SHA}" 2>&1 | tee readiness-build.txt
      - name: Verify outage and recovery without backend restart
        env:
          TEST365ALM_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:54329/test365alm
          TEST365ALM_DATASOURCE_USERNAME: test365alm
          TEST365ALM_DATASOURCE_PASSWORD: test365alm_dev_password
        run: |
          set +e
          python -u tools/verify_r02_readiness.py --wait-seconds 90 --listener-mode observe 2>&1 | tee readiness-recovery.txt
          status=${PIPESTATUS[0]}
          {
            echo '### Readiness recovery output'
            cat readiness-recovery.txt
          } >> "$GITHUB_STEP_SUMMARY"
          summary=$(tr '\n' ' ' < readiness-recovery.txt | cut -c1-4000)
          echo "::error title=readiness-recovery::${summary:-no output captured}"
          exit "$status"
      - name: Upload readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readiness-recovery-evidence
          path: |
            apps/server/readiness-build.txt
            readiness-recovery.txt
          if-no-files-found: ignore
      - name: Stop isolated PostgreSQL
        if: always()
        run: docker compose --env-file .env -p test365alm-r02 down --volumes
