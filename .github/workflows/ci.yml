name: Test365Alm CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  planning-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record checkout identity
        run: |
          printf 'event=%s\nmerge_ref=%s\ngithub_sha=%s\n' "$GITHUB_EVENT_NAME" "$GITHUB_REF" "$GITHUB_SHA" | tee checkout-sha.txt
          checkout_sha="$(git rev-parse HEAD)"
          printf 'checkout_sha=%s\n' "$checkout_sha" | tee -a checkout-sha.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record planning runtime
        run: |
          set -o pipefail
          python --version | tee planning-python-version.txt
      - name: Run planning tool tests
        run: |
          set -o pipefail
          python -m unittest discover -s tools/tests -v 2>&1 | tee planning-tests.txt
      - name: Validate planning package
        run: |
          set -o pipefail
          python tools/validate_package.py 2>&1 | tee planning-validation.txt
      - name: Run P0 health check
        run: |
          set -o pipefail
          python tools/p0_health_check.py 2>&1 | tee planning-p0-health.txt
      - name: Upload planning evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: planning-evidence
          path: |
            planning-python-version.txt
            checkout-sha.txt
            planning-tests.txt
            planning-validation.txt
            planning-p0-health.txt
          if-no-files-found: error

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - name: Record checkout identity
        run: |
          printf 'event=%s\nmerge_ref=%s\ngithub_sha=%s\n' "$GITHUB_EVENT_NAME" "$GITHUB_REF" "$GITHUB_SHA" | tee checkout-sha.txt
          checkout_sha="$(git rev-parse HEAD)"
          printf 'checkout_sha=%s\n' "$checkout_sha" | tee -a checkout-sha.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Record frontend runtime
        run: |
          set -o pipefail
          node --version | tee runtime-node.txt
          npm --version | tee runtime-npm.txt
      - run: |
          set -o pipefail
          npm ci 2>&1 | tee npm-ci.txt
      - run: |
          set -o pipefail
          npm run lint 2>&1 | tee lint.txt
      - run: |
          set -o pipefail
          npm run test:run -- --reporter=verbose 2>&1 | tee test-results.txt
      - run: |
          set -o pipefail
          npm run build 2>&1 | tee build.txt
      - name: Upload frontend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-evidence
          path: |
            apps/web/runtime-node.txt
            apps/web/runtime-npm.txt
            apps/web/checkout-sha.txt
            apps/web/npm-ci.txt
            apps/web/lint.txt
            apps/web/test-results.txt
            apps/web/build.txt
          if-no-files-found: error

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4
      - name: Record checkout identity
        run: |
          printf 'event=%s\nmerge_ref=%s\ngithub_sha=%s\n' "$GITHUB_EVENT_NAME" "$GITHUB_REF" "$GITHUB_SHA" | tee checkout-sha.txt
          checkout_sha="$(git rev-parse HEAD)"
          printf 'checkout_sha=%s\n' "$checkout_sha" | tee -a checkout-sha.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Ensure Maven Wrapper is executable
        run: chmod +x mvnw
      - name: Record backend runtime
        run: |
          set -o pipefail
          java -version 2>&1 | tee runtime-java.txt
          ./mvnw -version | tee runtime-maven.txt
      - name: Run server unit tests
        run: |
          set -o pipefail
          ./mvnw -B -ntp test 2>&1 | tee unit-tests.txt
      - name: Run PostgreSQL integration tests and build
        run: |
          set -o pipefail
          ./mvnw -B -ntp -Pintegration verify "-Dbuild.commit=${GITHUB_SHA}" 2>&1 | tee integration-build.txt
      - name: Upload backend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-evidence
          path: |
            apps/server/runtime-java.txt
            apps/server/runtime-maven.txt
            apps/server/checkout-sha.txt
            apps/server/unit-tests.txt
            apps/server/integration-build.txt
            apps/server/target/surefire-reports/**
            apps/server/target/failsafe-reports/**
          if-no-files-found: error

  readiness-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record checkout identity
        run: |
          printf 'event=%s\nmerge_ref=%s\ngithub_sha=%s\n' "$GITHUB_EVENT_NAME" "$GITHUB_REF" "$GITHUB_SHA" | tee checkout-sha.txt
          checkout_sha="$(git rev-parse HEAD)"
          printf 'checkout_sha=%s\n' "$checkout_sha" | tee -a checkout-sha.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ensure Maven Wrapper is executable
        run: chmod +x apps/server/mvnw
      - name: Start isolated PostgreSQL
        run: |
          cp .env.example .env.r02-test
      - name: Build server jar for outage check
        working-directory: apps/server
        run: |
          set -o pipefail
          ./mvnw -B -ntp package -DskipTests "-Dbuild.commit=${GITHUB_SHA}" 2>&1 | tee readiness-build.txt
      - name: Verify pre-existing populated project is untouched
        run: |
          set -o pipefail
          python -u tools/verify_r02_preexisting_project.py --env-file .env.r02-test 2>&1 | tee preexisting-project.txt
      - name: Verify outage and recovery without backend restart
        run: |
          set +e
          python -u tools/verify_r02_readiness.py --env-file .env.r02-test --compose-project "test365alm-r02-${GITHUB_RUN_ID}" --expected-commit "${GITHUB_SHA}" --wait-seconds 90 2>&1 | tee readiness-recovery.txt
          status=${PIPESTATUS[0]}
          {
            echo '### Readiness recovery output'
            cat readiness-recovery.txt
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            summary=$(tr '\n' ' ' < readiness-recovery.txt | cut -c1-4000)
            echo "::error title=readiness-recovery::${summary:-no output captured}"
          else
            echo "Readiness recovery passed for ${GITHUB_SHA}"
          fi
          exit "$status"
      - name: Upload readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readiness-recovery-evidence
          path: |
            apps/server/readiness-build.txt
            checkout-sha.txt
            preexisting-project.txt
            local-evidence/r02-control/**/control-result.json
            readiness-recovery.txt
          if-no-files-found: error
      - name: Stop isolated PostgreSQL
        if: always()
        run: |
          status=0
          python tools/cleanup_r02_resources.py --root local-evidence/r02-readiness || status=1
          python tools/cleanup_r02_resources.py --root local-evidence/r02-control || status=1
          exit "$status"

  migration-failure:
    runs-on: ubuntu-latest
    env:
      TEST365ALM_RUN_ID: r02-migration-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Record checkout identity
        run: |
          printf 'event=%s\nmerge_ref=%s\ngithub_sha=%s\n' "$GITHUB_EVENT_NAME" "$GITHUB_REF" "$GITHUB_SHA" | tee checkout-sha.txt
          checkout_sha="$(git rev-parse HEAD)"
          printf 'checkout_sha=%s\n' "$checkout_sha" | tee -a checkout-sha.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ensure Maven Wrapper is executable
        run: chmod +x apps/server/mvnw
      - name: Create dedicated migration test configuration
        run: cp .env.example .env.r02-test
      - name: Build server jar for migration failure check
        working-directory: apps/server
        run: |
          set -o pipefail
          ./mvnw -B -ntp package -DskipTests "-Dbuild.commit=${GITHUB_SHA}" 2>&1 | tee migration-build.txt
      - name: Verify intentional migration startup failure
        run: |
          set +e
          python -u tools/verify_r02_migration_failure.py --env-file .env.r02-test --compose-project "test365alm-r02-migration-${GITHUB_RUN_ID}" --server-port 18082 --wait-seconds 90 2>&1 | tee migration-failure.txt
          status=${PIPESTATUS[0]}
          {
            echo '### Migration failure output'
            cat migration-failure.txt
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            summary=$(tr '\n' ' ' < migration-failure.txt | cut -c1-4000)
            echo "::error title=migration-failure::${summary:-no output captured}"
          else
            echo "Intentional migration failure was detected for ${GITHUB_SHA}"
          fi
          exit "$status"
      - name: Upload migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-failure-evidence
          path: |
            checkout-sha.txt
            apps/server/migration-build.txt
            migration-failure.txt
            local-evidence/r02-migration-failure/**
          if-no-files-found: error
      - name: Stop migration test PostgreSQL
        if: always()
        run: |
          python tools/cleanup_r02_resources.py --root local-evidence/r02-migration-failure

  oidc-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record checkout identity
        run: |
          printf 'event=%s\nref=%s\ngithub_sha=%s\ncheckout_sha=%s\n' \
            "$GITHUB_EVENT_NAME" "$GITHUB_REF" "$GITHUB_SHA" "$(git rev-parse HEAD)" > r03-checkout-sha.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser and build application
        run: |
          set -euo pipefail
          mkdir -p local-evidence/r03
          java -version 2>&1 | tee local-evidence/r03/java-version.txt
          node --version | tee local-evidence/r03/node-version.txt
          python --version | tee local-evidence/r03/python-version.txt
          chmod +x apps/server/mvnw
          (cd apps/server && ./mvnw -B -ntp package -DskipTests "-Dbuild.commit=${GITHUB_SHA}") \
            2>&1 | tee local-evidence/r03/server-build.txt
          (cd apps/web && npm ci && npx playwright install --with-deps chromium) \
            2>&1 | tee local-evidence/r03/browser-install.txt
      - name: Real Keycloak browser login, me and logout
        run: |
          set -euo pipefail
          python tools/prepare_r03_dev.py
          set -a
          source .env.r03
          set +a
          # The pinned Keycloak image runs as UID 1000. The import includes a
          # disposable password and must remain readable only to that UID.
          sudo chown 1000:1000 local-evidence/r03/realm.json
          sudo chmod 0400 local-evidence/r03/realm.json
          stat -c 'realm uid=%u gid=%g mode=%a' local-evidence/r03/realm.json \
            > local-evidence/r03/import-permissions.txt
          stat -c 'env uid=%u gid=%g mode=%a' .env.r03 \
            >> local-evidence/r03/import-permissions.txt
          project="test365alm-r03-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export R03_COMPOSE_PROJECT="$project"
          export TEST365ALM_SESSION_TIMEOUT=25s
          if [ -n "$(docker ps -aq --filter "label=com.docker.compose.project=${project}")" ] || \
             [ -n "$(docker network ls -q --filter "label=com.docker.compose.project=${project}")" ] || \
             [ -n "$(docker volume ls -q --filter "label=com.docker.compose.project=${project}")" ]; then
            echo 'R03 project already has Docker resources; refusing to reuse it' >&2
            exit 2
          fi
          backend_pid=''
          web_pid=''
          cleanup() {
            status=$?
            # Capture diagnostics before removing only this CI run's project.
            docker image inspect quay.io/keycloak/keycloak:26.4.4@sha256:c6459d5fae1b759f5d667ebdc6237ab3121379c3494e213898569014ede1846d \
              --format 'keycloak image user={{.Config.User}}' \
              > local-evidence/r03/image-user.txt 2>&1 || status=1
            docker compose --env-file .env.r03 -f compose.r03.yaml -p "$project" ps -a \
              > local-evidence/r03/containers-raw.txt 2>&1 || status=1
            docker compose --env-file .env.r03 -f compose.r03.yaml -p "$project" logs --no-color postgres keycloak \
              > local-evidence/r03/containers-raw.log 2>&1 || status=1
            python tools/redact_r03_logs.py .env.r03 local-evidence/r03/containers-raw.txt local-evidence/r03/containers.txt || status=1
            python tools/redact_r03_logs.py .env.r03 local-evidence/r03/containers-raw.log local-evidence/r03/containers.log || status=1
            rm -f local-evidence/r03/containers-raw.txt local-evidence/r03/containers-raw.log
            if [ -n "$web_pid" ]; then kill "$web_pid" 2>/dev/null || true; fi
            if [ -n "$backend_pid" ]; then kill "$backend_pid" 2>/dev/null || true; fi
            docker compose --env-file .env.r03 -f compose.r03.yaml -p "$project" down || status=1
            exit "$status"
          }
          trap cleanup EXIT
          docker compose --env-file .env.r03 -f compose.r03.yaml -p "$project" up -d postgres keycloak
          for i in $(seq 1 90); do
            container_id="$(docker compose --env-file .env.r03 -f compose.r03.yaml -p "$project" ps -q keycloak)"
            if [ -z "$container_id" ] || [ "$(docker inspect --format '{{.State.Running}}' "$container_id")" != true ]; then
              echo 'Keycloak container exited before discovery became available' >&2
              exit 1
            fi
            if curl --silent --fail --max-time 2 \
              http://127.0.0.1:18090/realms/test365alm/.well-known/openid-configuration >/dev/null; then break; fi
            sleep 2
          done
          curl --silent --show-error --fail --max-time 3 \
            http://127.0.0.1:18090/realms/test365alm/.well-known/openid-configuration \
            | python -c 'import json,os,sys; d=json.load(sys.stdin); assert d["issuer"] == os.environ["TEST365ALM_OIDC_ISSUER"], "OIDC issuer mismatch"'
          docker compose --env-file .env.r03 -f compose.r03.yaml -p "$project" exec -T keycloak \
            sh -c 'test -r /opt/keycloak/data/import/realm.json'
          java -jar apps/server/target/server-0.0.1-SNAPSHOT.jar \
            > local-evidence/r03/backend.log 2>&1 & backend_pid=$!
          for i in $(seq 1 60); do
            kill -0 "$backend_pid"
            if curl --silent --fail --max-time 2 http://127.0.0.1:8080/health/ready >/dev/null; then break; fi
            sleep 2
          done
          curl --silent --fail --max-time 3 http://127.0.0.1:8080/health/ready >/dev/null
          (cd apps/web && npm run dev -- --host 127.0.0.1) \
            > local-evidence/r03/web.log 2>&1 & web_pid=$!
          for i in $(seq 1 30); do
            kill -0 "$web_pid"
            if curl --silent --fail --max-time 2 http://127.0.0.1:5173/ >/dev/null; then break; fi
            sleep 1
          done
          (cd apps/web && npm run test:e2e) 2>&1 | tee local-evidence/r03/e2e.log
      - name: Require real browser report
        if: always()
        run: python tools/verify_r03_report.py local-evidence/r03/playwright-results.xml
      - name: Upload R03 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r03-oidc-browser-evidence
          path: |
            r03-checkout-sha.txt
            local-evidence/r03/java-version.txt
            local-evidence/r03/node-version.txt
            local-evidence/r03/python-version.txt
            local-evidence/r03/server-build.txt
            local-evidence/r03/browser-install.txt
            local-evidence/r03/e2e.log
            local-evidence/r03/playwright-results.xml
            local-evidence/r03/import-permissions.txt
            local-evidence/r03/image-user.txt
            local-evidence/r03/containers.txt
            local-evidence/r03/containers.log
          if-no-files-found: error
