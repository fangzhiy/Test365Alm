spring.application.name=Test365Alm
server.address=${TEST365ALM_SERVER_ADDRESS:127.0.0.1}
server.port=${TEST365ALM_SERVER_PORT:8080}
app.version=${APP_VERSION:unknown}
app.commit=${APP_COMMIT:unknown}

# Request DTOs define a closed HTTP contract.  Unknown fields must be
# rejected at the boundary instead of being silently discarded.
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.mapper.allow-coercion-of-scalars=false

spring.datasource.url=${TEST365ALM_DATASOURCE_URL}
spring.datasource.username=${TEST365ALM_DATASOURCE_USERNAME}
spring.datasource.password=${TEST365ALM_DATASOURCE_PASSWORD}
spring.datasource.hikari.connection-timeout=${TEST365ALM_DB_CONNECTION_TIMEOUT_MS:2000}
spring.datasource.hikari.validation-timeout=${TEST365ALM_DB_CONNECTION_TIMEOUT_MS:2000}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.fail-on-missing-locations=true
# Schema changes run with a separately provisioned migration identity.  The
# default keeps local development backward-compatible when no separate values
# are supplied; restricted runtime tests set all three TEST365ALM_FLYWAY_* keys.
spring.flyway.url=${TEST365ALM_FLYWAY_URL:${spring.datasource.url}}
spring.flyway.user=${TEST365ALM_FLYWAY_USERNAME:${spring.datasource.username}}
spring.flyway.password=${TEST365ALM_FLYWAY_PASSWORD:${spring.datasource.password}}

test365alm.readiness.timeout-ms=${TEST365ALM_READINESS_TIMEOUT_MS:2000}

management.endpoints.web.exposure.include=health
server.servlet.session.timeout=${TEST365ALM_SESSION_TIMEOUT:30m}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/
server.servlet.session.cookie.secure=${TEST365ALM_COOKIE_SECURE:false}
test365alm.oidc.enabled=false
