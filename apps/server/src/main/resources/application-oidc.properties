test365alm.oidc.enabled=true
spring.security.oauth2.client.registration.test365alm.provider=test365alm
spring.security.oauth2.client.registration.test365alm.client-id=test365alm-web
spring.security.oauth2.client.registration.test365alm.client-authentication-method=none
spring.security.oauth2.client.registration.test365alm.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.test365alm.redirect-uri=${TEST365ALM_OIDC_REDIRECT_URI:http://127.0.0.1:5173/login/oauth2/code/test365alm}
spring.security.oauth2.client.registration.test365alm.scope=openid,profile,email
spring.security.oauth2.client.provider.test365alm.issuer-uri=${TEST365ALM_OIDC_ISSUER}
test365alm.web.origin=${TEST365ALM_WEB_ORIGIN:http://127.0.0.1:5173}
